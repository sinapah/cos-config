groups:
  - name: log-recording-group
    rules:
      - record: WarningLogRate
        expr: sum by (juju_application) (rate({} | json | level="WARNING" [5m]))
        labels:
          severity: warning
          team: observability

      - record: FatalLogCount
        expr: sum by (juju_application) (count_over_time({} | json | level="FATAL" [1h]))
        labels:
          severity: critical
          team: observability