groups:
  - name: first-group
    rules:
      - alert: ValidRuleOneGroupOne
        expr: sum by (juju_application) (rate({juju_application="rule-one-k8s", juju_model="observability"} | json | level="ERROR" [15m])) > 0
        for: 15m
        labels:
          severity: critical
          team: observability
          juju_model_uuid: "e9f39fb5-e6ff-4e0c-82a5-712bdd7e1912"
          juju_application: "rule-one-k8s"
          juju_model: "observability"
          environment: "staging"
          zone: "can-east"
        annotations:
          summary: High error log rate
          description: Error logs detected for application {{ $labels.juju_application }}

      - alert: ValidRuleTwoGroupOne
        expr: sum by (juju_application) (count_over_time({juju_application="rule-two-k8s", juju_model="observability"} |~ "(?i)panic|fatal|oom-killer" [10m])) > 0
        for: 15m
        labels:
          severity: warning
          team: unknown
          juju_model_uuid: "7b3c2e91-4a6f-4d82-9c17-5e8b3f20a6d4"
          juju_application: "rule-two-k8s"
          juju_model: "observability"
          environment: "production"
          zone: "can-east"
        annotations:
          summary: Critical system event logged
          description: Panic or OOM log pattern encountered for {{ $labels.juju_application }}

      - alert: ValidRuleThreeGroupOne
        expr: sum by (juju_application) (rate({juju_application="rule-three-k8s", juju_model="observability"} | logfmt | status >= 500 [5m])) > 5
        for: 15m
        labels:
          severity: warning
          team: unknown
          juju_model_uuid: "7b3c2e91-4a6f-4d82-9c17-5e8b3f20a6d4"
          juju_application: "rule-three-k8s"
          juju_model: "observability"
          environment: "production"
          zone: "can-west"
        annotations:
          summary: HTTP 5xx log response spike
          description: Excessive 5xx status codes logged for {{ $labels.juju_application }}

  - name: second-group
    rules:
      - alert: ValidRuleOneGroupTwo
        expr: sum by (juju_application) (rate({juju_application="some-charm-k8s", juju_model="observability"} | json | level="WARN" [10m])) > 100
        for: 15m
        labels:
          severity: critical
          team: observability
          juju_model_uuid: "e9f39fb5-e6ff-4e0c-82a5-712bdd7e1912"
          juju_application: "some-charm-k8s"
          juju_model: "observability"
        annotations:
          summary: High warning log volume
          description: Warning log rate exceeded threshold for {{ $labels.juju_application }}

      - alert: ValidRuleTwoGroupTwo
        expr: sum by (juju_application) (count_over_time({juju_application="some-charm-vm", juju_model="observability"} |~ "(?i)connection refused|timeout" [5m])) > 10
        for: 15m
        labels:
          severity: warning
          team: unknown
          juju_model_uuid: "7b3c2e91-4a6f-4d82-9c17-5e8b3f20a6d4"
          juju_application: "some-charm-vm"
          juju_model: "observability"
        annotations:
          summary: Connection errors logged
          description: Multiple connection refusal or timeout logs observed for {{ $labels.juju_application }}

      - alert: ValidRuleThreeGroupTwo
        expr: sum by (juju_application) (rate({juju_application="some-charm-k8s", juju_model="observability"} | json | event="authentication_failed" [5m])) > 20
        for: 15m
        labels:
          severity: warning
          team: unknown
          juju_model_uuid: "7b3c2e91-4a6f-4d82-9c17-5e8b3f20a6d4"
          juju_application: "some-charm-k8s"
          juju_model: "observability"
        annotations:
          summary: Authentication failures detected
          description: High volume of failed authentication events for {{ $labels.juju_application }}